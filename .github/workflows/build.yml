name: Build and test
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Headless core / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure without JUCE or audio device
        run: cmake --preset core
      - name: Build
        run: cmake --build --preset core
      - name: Test
        run: |
          ctest --preset core --verbose --output-junit results.xml
          test -s build/core/results.xml
      - name: Test independent observation reader
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Retain build metadata and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-core-evidence
          path: |
            build/core/fader-build-info.json
            build/core/results.xml
            build/core/Testing/Temporary/LastTest.log
          retention-days: 14
          if-no-files-found: warn

  windows:
    name: Native app and tests / Windows x64
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record Windows image and Visual Studio installation
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          @{ imageOS = $env:ImageOS; imageVersion = $env:ImageVersion;
             caption = $os.Caption; version = $os.Version; build = $os.BuildNumber;
             architecture = $os.OSArchitecture } | ConvertTo-Json | Set-Content build/windows-image.json
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -format json | Set-Content build/windows-visual-studio.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Initialize the installed MSVC x64 toolchain
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$installation) { throw "MSVC x64 tools are unavailable" }
          $devCmd = Join-Path $installation.Trim() "Common7\Tools\VsDevCmd.bat"
          $command = '"' + $devCmd + '" -no_logo -arch=x64 -host_arch=x64 && set'
          $compilerEnvironment = & $env:COMSPEC /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "MSVC developer environment failed" }
          $record = @{}
          foreach ($line in $compilerEnvironment) {
            if ($line -match '^(Path|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCToolsVersion|WindowsSdkDir|WindowsSDKVersion|VSCMD_ARG_TGT_ARCH)=(.*)$') {
              $key = $matches[1]
              $value = $matches[2]
              [Environment]::SetEnvironmentVariable($key, $value, 'Process')
              "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              if ($key -notmatch '^(Path|INCLUDE|LIB|LIBPATH)$') { $record[$key] = $value }
            }
          }
          $record | ConvertTo-Json | Set-Content build/windows-compiler-env.json
      - name: Configure pinned native dependencies with MSVC and Ninja
        run: cmake --preset native -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
      - name: Build app, probe and tests
        run: cmake --build --preset native
      - name: Test without audio or MIDI hardware
        run: |
          ctest --preset native --verbose --output-junit results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path build/native/results.xml)) { throw "JUnit results are missing" }
      - name: Check serialized stress observations independently
        run: |
          python scripts/verify-stress-observations.py build/native/Testing/Temporary/LastTest.log --ctest-log --key timedSmoke --output build/native/stress-wall-observations.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-stress-observations.py build/native/Testing/Temporary/LastTest.log --ctest-log --key cpuDiagnosticSmoke --output build/native/stress-cpu-observations.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record built application
        run: |
          $app = "build/native/Fader_artefacts/Release/Fader.exe"
          if (!(Test-Path $app) -or (Get-Item $app).Length -eq 0) { throw "Built app is missing" }
          Get-FileHash -Algorithm SHA256 $app | Format-List | Out-File build/windows-app.txt
      - name: Retain Windows build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-evidence
          path: |
            build/windows-image.json
            build/windows-visual-studio.json
            build/windows-compiler-env.json
            build/windows-app.txt
            build/native/fader-build-info.json
            build/native/results.xml
            build/native/Testing/Temporary/LastTest.log
            build/native/stress-*-observations.json
            build/native/Fader_artefacts/Release/Fader.exe
          retention-days: 14
          if-no-files-found: warn

  mac:
    name: Native app and tests / macOS
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure with pinned JUCE
        run: cmake --preset native
      - name: Build app, probe and tests
        run: cmake --build --preset native
      - name: Test without audio hardware
        run: |
          ctest --preset native --verbose --output-junit results.xml
          test -s build/native/results.xml
      - name: Check serialized stress observations independently
        run: |
          python3 scripts/verify-stress-observations.py build/native/Testing/Temporary/LastTest.log --ctest-log --key timedSmoke --output build/native/stress-wall-observations.json
          python3 scripts/verify-stress-observations.py build/native/Testing/Temporary/LastTest.log --ctest-log --key cpuDiagnosticSmoke --output build/native/stress-cpu-observations.json
      - name: Verify application bundle
        run: |
          codesign --force --deep --sign - build/native/Fader_artefacts/Release/Fader.app
          codesign --verify --deep --strict build/native/Fader_artefacts/Release/Fader.app
      - name: Retain build metadata and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-native-evidence
          path: |
            build/native/fader-build-info.json
            build/native/results.xml
            build/native/Testing/Temporary/LastTest.log
            build/native/stress-*-observations.json
          retention-days: 14
          if-no-files-found: warn
